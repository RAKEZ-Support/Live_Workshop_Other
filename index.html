<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKEZ CX Workshop — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&display=swap');

  :root {
    --primary-dark: #028090;
    --accent-teal: #00a896;
    --primary-gradient: linear-gradient(135deg, #028090 0%, #00a896 50%, #02c39a 100%);
    --bg: #f4f7f9;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --hairline: #e8edf1;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --light-teal: #f0fdfa;
    --font-display: 'Fraunces', Georgia, serif;
    --shadow-soft: 0 2px 8px rgba(15,42,59,.04), 0 10px 28px rgba(15,42,59,.06);
    --shadow-lift: 0 6px 16px rgba(2,128,144,.10), 0 16px 36px rgba(2,128,144,.08);
    --seg-ni: #7030A0; --seg-ni-bg: #F1E8F8;
    --seg-ind: #00A99D; --seg-ind-bg: #00C1BC;
    --seg-lta: #159FCC; --seg-lta-bg: #A3E7FF;
    --seg-sa: #0072A3; --seg-sa-bg: #00B0F0;
    --seg-label-text: #2B2B45;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: radial-gradient(circle at 12% 0%, rgba(2,168,150,.06), transparent 42%),
                radial-gradient(circle at 92% 8%, rgba(2,128,144,.05), transparent 38%), var(--bg);
    color: var(--text-main);
    margin: 0; padding: 0; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--primary-dark); margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 60px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-badge { width:38px; height:38px; border-radius:11px; background:var(--primary-gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem; box-shadow:var(--shadow-soft); }
  .brand h1 { font-size:1.25rem; }
  .brand p { margin:1px 0 0; font-size:.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .pill-btn { background:#fff; border:1.5px solid var(--hairline); color:var(--text-muted); padding:8px 16px; border-radius:999px; font-weight:700; font-size:.8rem; cursor:pointer; transition:.2s; }
  .pill-btn:hover { border-color:var(--accent-teal); color:var(--primary-dark); }
  .pill-btn.on { background:var(--primary-gradient); color:#fff; border-color:transparent; box-shadow:var(--shadow-soft); }

  .card { background:#fff; border:1px solid var(--hairline); border-radius:18px; padding:24px; box-shadow:var(--shadow-soft); }
  .card + .card { margin-top:18px; }

  .round-tabs { display:flex; gap:8px; background:#f6f9fa; border:1px solid var(--hairline); border-radius:14px; padding:6px; margin-bottom:20px; }
  .round-tab { flex:1; text-align:center; padding:12px 8px; border-radius:10px; font-weight:700; font-size:.85rem; color:var(--text-muted); cursor:pointer; transition:.2s; }
  .round-tab.active { background:#fff; color:var(--primary-dark); box-shadow:var(--shadow-soft); }



  .qr-box { text-align:center; }
  #qrcode { display:inline-block; padding:14px; background:#fff; border:1px solid var(--hairline); border-radius:16px; box-shadow:var(--shadow-soft); }
  .link-row { display:flex; gap:8px; margin-top:14px; align-items:center; }
  .link-row input { flex:1; font-size:.75rem; padding:8px 10px; border:1.5px solid var(--hairline); border-radius:8px; color:var(--text-muted); background:#f9fbfb; }
  .small-btn { border:1.5px solid var(--hairline); background:#fff; padding:8px 12px; border-radius:8px; font-weight:700; font-size:.78rem; cursor:pointer; color:var(--primary-dark); }
  .small-btn:hover { border-color:var(--accent-teal); }
  .warn-note { font-size:.74rem; color:#a16207; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; margin-top:10px; line-height:1.5; }
  .count-chip { display:inline-flex; align-items:center; gap:6px; background:var(--light-teal); color:var(--primary-dark); font-weight:800; font-size:.8rem; padding:6px 12px; border-radius:999px; margin-top:10px; }

  .seg-block { border:1px solid var(--hairline); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .seg-block h4 { display:flex; align-items:center; gap:8px; font-family:'Plus Jakarta Sans',sans-serif; font-size:.92rem; font-weight:800; color:var(--text-main); margin:0 0 12px; }
  .seg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:.8rem; }
  .bar-label { width:150px; flex-shrink:0; color:var(--text-main); font-weight:600; }
  .bar-track { flex:1; height:16px; background:#f1f5f9; border-radius:8px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:8px; background:var(--primary-gradient); transition:width .3s; }
  .bar-fill.top { background:linear-gradient(135deg,#10b981,#059669); }
  .bar-count { width:34px; text-align:right; font-weight:800; color:var(--text-muted); }

  .resp-list { list-style:none; margin:0; padding:0; }
  .resp-item { border-bottom:1px solid #f1f5f9; padding:10px 0; font-size:.85rem; }
  .resp-item:last-child { border-bottom:none; }
  .resp-name { font-weight:800; color:var(--primary-dark); margin-right:6px; }
  .resp-time { color:#94a3b8; font-size:.72rem; }
  .resp-field { color:var(--text-muted); margin-top:2px; }
  .kw-chip { display:inline-block; background:var(--light-teal); color:var(--primary-dark); font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; margin:2px 4px 2px 0; }

  .empty-state { text-align:center; color:var(--text-muted); font-size:.85rem; padding:24px 10px; }

  /* ---- participant form ---- */
  .p-shell { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  .p-head { text-align:center; margin-bottom:18px; }
  .p-head .rnd-icon { font-size:2.2rem; }
  .p-head h2 { font-size:1.3rem; margin-top:6px; }
  .p-head p { color:var(--text-muted); font-size:.85rem; margin-top:4px; }

  label { display:block; font-weight:700; font-size:.85rem; margin-bottom:7px; color:var(--text-main); }
  input[type=text], textarea { width:100%; padding:12px 14px; border:1.5px solid var(--hairline); border-radius:11px; font-size:.92rem; font-family:inherit; background:#fbfcfd; transition:.2s; }
  input[type=text]:focus, textarea:focus { outline:none; border-color:var(--accent-teal); background:#fff; box-shadow:0 0 0 3.5px rgba(0,168,150,.13); }
  textarea { resize:vertical; min-height:64px; }

  .seg-tabs { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:16px; }
  .seg-tab { position:relative; display:inline-flex; align-items:center; border:1.5px solid var(--hairline); border-radius:999px; background:#fff; padding:5px; cursor:pointer; opacity:.6; transition:.2s; }
  .seg-tab.active { opacity:1; border-color:var(--accent-teal); box-shadow:0 6px 16px rgba(2,128,144,.14); }
  .segment-badge { display:inline-flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; border-radius:999px; font-weight:700; font-size:.8rem; color:var(--seg-label-text); white-space:nowrap; }
  .segment-badge .ic { width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-size:.85rem; }
  .badge-ni{background:var(--seg-ni-bg)} .badge-ind{background:var(--seg-ind-bg)} .badge-lta{background:var(--seg-lta-bg)} .badge-sa{background:var(--seg-sa-bg)}

  .seg-panel { display:none; }
  .seg-panel.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1;} }

  .chip-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; justify-content:center; padding:10px 8px; background:#fbfcfd; border:1.5px solid var(--hairline); border-radius:10px; font-size:.78rem; font-weight:600; cursor:pointer; user-select:none; min-height:42px; text-align:center; transition:.15s; }
  .chip input { display:none; }
  .chip::before { content:''; width:6px; height:6px; border-radius:50%; background:#cbd5e1; }
  .chip.on { background:var(--primary-gradient); color:#fff; border-color:var(--primary-dark); font-weight:700; }
  .chip.on::before { content:'\2713'; width:auto; height:auto; background:none; color:#fff; font-size:.7rem; }
  .other-input { width:100%; margin:8px 0 14px; padding:10px 13px; border:1.5px dashed var(--hairline); border-radius:10px; font-size:.83rem; font-style:italic; color:var(--text-main); background:#fbfcfd; font-family:inherit; transition:.2s; }
  .other-input:focus { outline:none; border-style:solid; border-color:var(--accent-teal); background:#fff; font-style:normal; box-shadow:0 0 0 3.5px rgba(0,168,150,.13); }

  .vision-card { border:1px solid var(--hairline); border-top:3px solid var(--sc,var(--accent-teal)); border-radius:14px; padding:15px 16px 18px; margin-bottom:14px; }
  .vscale-wrap { margin-bottom:18px; }
  .vscale-axis { display:flex; justify-content:space-between; font-size:.66rem; font-weight:800; letter-spacing:.05em; color:var(--text-muted); margin-bottom:6px; }
  .vscale-bar { display:flex; height:14px; border-radius:8px; overflow:hidden; }
  .vscale-seg { flex:1; }
  .vscale-labels { display:flex; gap:6px; margin-top:8px; }
  .vscale-labels > div { flex:1; text-align:center; font-size:.66rem; color:var(--text-muted); line-height:1.35; }
  .vscale-labels strong { display:block; color:var(--text-main); font-size:.72rem; margin-bottom:2px; }
  .cx-readout { display:flex; align-items:baseline; gap:8px; }
  .cx-score { font-size:1.5rem; font-weight:800; line-height:1; color:var(--sc,var(--accent-teal)); font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  .cx-score .cx-max { font-size:.78rem; font-weight:700; color:#9aa4b2; }
  .cx-level { font-size:.72rem; font-weight:800; color:#fff; padding:4px 10px; border-radius:20px; white-space:nowrap; transition:background .12s ease; }
  .range-slider { width:100%; height:9px; border-radius:6px; outline:none; -webkit-appearance:none; appearance:none; margin:14px 0 4px; cursor:pointer;
    background:linear-gradient(90deg,#cdd2da 0%,#7f90a6 25%,#16bccf 50%,#00a8a8 72%,#00605c 100%); box-shadow:inset 0 1px 3px rgba(0,0,0,.12); }
  .range-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; cursor:grab;
    box-shadow:0 3px 9px rgba(0,0,0,.28); border:4px solid var(--sc,#00a8a8); transition:transform .12s ease; }
  .range-slider::-webkit-slider-thumb:hover { transform:scale(1.12); }
  .range-slider::-webkit-slider-thumb:active { cursor:grabbing; transform:scale(1.18); }
  .range-slider::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:#fff; cursor:grab; box-shadow:0 3px 9px rgba(0,0,0,.28); border:4px solid var(--sc,#00a8a8); }
  .range-slider::-moz-range-track { background:transparent; }
  .slider-ticks { display:flex; justify-content:space-between; font-size:.66rem; font-weight:700; color:#aab2bf; padding:0 2px; font-variant-numeric:tabular-nums; }

  .submit-bar { position:sticky; bottom:0; background:linear-gradient(180deg, transparent, var(--bg) 30%); padding:16px 0 4px; margin-top:10px; }
  button.primary { width:100%; background:var(--primary-gradient); color:#fff; border:none; padding:15px; border-radius:12px; font-weight:800; font-size:.98rem; cursor:pointer; box-shadow:var(--shadow-lift); }
  .done-box { text-align:center; padding:50px 16px; }
  .done-icon { width:64px; height:64px; border-radius:50%; background:#d1fae5; color:#10b981; display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 16px; }

  .err { color:var(--danger); font-size:.78rem; margin-top:6px; display:none; }

  /* ---------- North Star (KPI + target) ---------- */
  .ns-intro { font-size:.82rem; color:var(--text-muted); line-height:1.6; margin-bottom:16px; }
  .group-note { display:flex; gap:9px; align-items:flex-start; background:var(--light-teal); border:1px solid #99f6e4; border-radius:12px; padding:11px 14px; margin-bottom:14px; font-size:.8rem; line-height:1.5; color:#0f766e; }
  .group-note strong { color:var(--primary-dark); }
  .theme-block { border:1px solid var(--hairline); border-radius:14px; padding:16px 16px 14px; margin-bottom:14px; background:#fbfcfd; }
  .theme-head { display:flex; align-items:center; gap:9px; }
  .theme-head .th-ic { width:30px; height:30px; border-radius:9px; background:var(--light-teal); display:flex; align-items:center; justify-content:center; font-size:.95rem; flex-shrink:0; }
  .theme-head h5 { margin:0; font-family:var(--font-display); font-weight:600; font-size:1rem; color:var(--primary-dark); }
  .kpi-count { margin-left:auto; font-size:.72rem; font-weight:800; color:var(--text-muted); }
  .kpi-count.full { color:var(--danger); }
  .theme-sub { font-size:.74rem; color:var(--text-muted); margin:2px 0 12px 39px; }
  .kpi-row { border:1.5px solid var(--hairline); border-radius:11px; background:#fff; margin-bottom:8px; transition:.15s; }
  .kpi-row.on { border-color:var(--accent-teal); box-shadow:0 0 0 3px rgba(0,168,150,.10); }
  .kpi-head { display:flex; align-items:center; gap:10px; padding:11px 13px; cursor:pointer; }
  .kpi-tick { width:18px; height:18px; border-radius:5px; border:1.5px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.66rem; color:#fff; }
  .kpi-row.on .kpi-tick { background:var(--accent-teal); border-color:var(--accent-teal); }
  .kpi-row.on .kpi-tick::after { content:'\2713'; }
  .kpi-name { font-size:.85rem; font-weight:700; color:var(--text-main); }
  .kpi-base { margin-left:auto; text-align:right; font-size:.71rem; font-weight:700; color:var(--primary-dark); background:var(--light-teal); border-radius:999px; padding:4px 10px; }
  .kpi-base em { font-style:normal; font-weight:600; color:var(--text-muted); }
  .kpi-base.none { background:#f4f6f8; color:var(--text-muted); font-weight:600; }
  .kpi-target { display:none; padding:0 13px 12px 41px; }
  .kpi-row.on .kpi-target { display:block; }
  .target-input { width:100%; padding:9px 12px; border:1.5px solid var(--hairline); border-radius:9px; font-size:.83rem; font-family:inherit; background:#fbfcfd; }
  .target-input:focus { outline:none; border-color:var(--accent-teal); background:#fff; box-shadow:0 0 0 3.5px rgba(0,168,150,.13); }
  .custom-name { flex:1; min-width:0; padding:7px 11px; border:1.5px dashed var(--hairline); border-radius:9px; font-size:.83rem; font-family:inherit; background:#fbfcfd; }
  .custom-name:focus { outline:none; border-style:solid; border-color:var(--accent-teal); background:#fff; }
  .kpi-remove { border:none; background:none; color:var(--text-muted); font-size:.85rem; cursor:pointer; padding:4px 6px; border-radius:6px; }
  .kpi-remove:hover { color:var(--danger); background:var(--danger-bg); }
  .add-kpi { width:100%; border:1.5px dashed var(--hairline); background:none; color:var(--primary-dark); font-family:inherit; font-weight:700; font-size:.8rem; padding:10px; border-radius:10px; cursor:pointer; }
  .add-kpi:hover { border-color:var(--accent-teal); background:var(--light-teal); }
  .th-label { font-size:.74rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }

  /* North Star results — a scorecard, not a tally. What matters is the target
     each group set and the distance from today, so the layout mirrors the
     "Our North Star" slide: three themed columns, KPI left, target right. */
  .ns-seg { background:#fff; border:1px solid var(--hairline); border-left:5px solid var(--hairline); border-radius:16px; margin-bottom:20px; overflow:hidden; }
  .ns-seg-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:16px 22px; border-bottom:1px solid var(--hairline); }
  .ns-seg-name { font-family:var(--font-display); font-size:1.05rem; font-weight:650; }
  .ns-seg-meta { margin-left:auto; font-size:.75rem; color:var(--text-muted); }
  .ns-grid { display:grid; grid-template-columns:repeat(3,1fr); }
  .ns-card { padding:18px 22px 20px; border-right:1px solid var(--hairline); }
  .ns-card:last-child { border-right:none; }
  .ns-card-head { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .ns-card-head .ns-ic { width:26px; height:26px; border-radius:8px; background:var(--light-teal); display:flex; align-items:center; justify-content:center; font-size:.8rem; flex-shrink:0; }
  .ns-card-head h5 { margin:0; font-size:.82rem; font-weight:700; color:var(--primary-dark); letter-spacing:.01em; }
  .ns-card-head .ns-num { margin-left:auto; font-size:.72rem; font-weight:700; color:var(--text-muted); }
  .ns-kpi { padding:12px 0; border-bottom:1px dashed #eceff3; }
  .ns-kpi:last-child { border-bottom:none; padding-bottom:0; }
  .ns-kpi-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .ns-kpi-name { font-size:.85rem; font-weight:650; color:var(--text-main); line-height:1.35; }
  .ns-kpi-target { font-size:1rem; font-weight:800; color:var(--primary-dark); white-space:nowrap; }
  .ns-kpi-target.none { font-size:.78rem; font-weight:600; color:var(--text-muted); }
  .ns-kpi-base { margin-top:5px; font-size:.73rem; color:var(--text-muted); line-height:1.5; }
  .ns-delta { display:inline-block; margin-left:7px; padding:1px 8px; border-radius:999px; background:#eef2f5; color:#475569; font-weight:700; font-size:.7rem; }
  .ns-alt { margin-top:6px; font-size:.72rem; color:var(--text-muted); }
  .ns-alt b { color:var(--text-main); font-weight:650; }
  .ns-card .ns-empty { font-size:.78rem; color:var(--text-muted); padding:10px 0; }
  .ns-waiting { padding:22px; text-align:center; font-size:.82rem; color:var(--text-muted); }

  @media (max-width:900px){
    .ns-grid { grid-template-columns:1fr; }
    .ns-card { border-right:none; border-bottom:1px solid var(--hairline); }
    .ns-card:last-child { border-bottom:none; }
  }
  @media (max-width:600px){
    .chip-grid{ grid-template-columns:1fr 1fr; }
    .kpi-head { flex-wrap:wrap; }
    .kpi-base { margin-left:28px; text-align:left; }
    .kpi-target { padding-left:13px; }
    .target-line { margin-left:0; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== DATA MODEL ============================== */
const SEGMENTS = [
  { key:'ni',  icon:'🏢', label:'Non-Industrial',   badge:'badge-ni',  color:'var(--seg-ni)'  },
  { key:'ind', icon:'🏭', label:'Industrial',        badge:'badge-ind', color:'var(--seg-ind)' },
  { key:'lta', icon:'🧑‍💼', label:'Long-Tail/Growth Agents',  badge:'badge-lta', color:'var(--seg-lta)' },
  { key:'sa',  icon:'⭐', label:'Strategic Agents',  badge:'badge-sa',  color:'var(--seg-sa)'  },
];
const LEVELS = ['Complex','Transactional','Guided','Effortless','Proactive & Loved'];
const LEVEL_COLORS = ['#6C7787','#5E7290','#0E93B2','#00847F','#00655F'];
// 0.0–0.9 Complex, 1.0–1.9 Transactional, 2.0–2.9 Guided, 3.0–3.9 Effortless, 4.0–5.0 Proactive & Loved
function levelForScore(score) {
  let band = Math.floor(score);
  if (band < 0) band = 0;
  if (band > 4) band = 4;
  return { name: LEVELS[band], color: LEVEL_COLORS[band] };
}
const SERVE_OPTS   = ['Digital-First','Self-Serve','Relationship-Led','Priority Support','Guided Assistance'];
const CHANNEL_OPTS = ['Portal','Email','Call','Mobile App','Key Accounts','WhatsApp'];
const FEEL_OPTS    = ['Consultative','Proactive','Technical','Intuitive','Fast','Guided','Transparent','SLA-Driven','Empathetic','Reliable'];
const OWNER_OPTS   = ['Contact Center Enabled Support','Dedicated Account Manager','Hybrid Model'];

/* ---------- North Star: KPI catalogue, per-theme, filtered per segment ---------- */
const ALL_SEGS = ['ni','ind','lta','sa'];
const MAX_KPIS_PER_THEME = 5;

const KPI_THEMES = [
  { key:'experience',  icon:'\u{1F929}', label:'Experience',             sub:'KPIs leading to a better experience' },
  { key:'commercial',  icon:'\u{1F4C8}', label:'Commercial',             sub:'KPIs contributing to more revenue' },
  { key:'operational', icon:'\u2699\uFE0F', label:'Operational Efficiency', sub:'KPIs measuring improved efficiency' },
];

// `unit` only drives the target placeholder — targets are captured as free text
// so people can write "\u2265 90%", "\u2264 3 days" or "top quartile" as they wish.
const KPI_CATALOGUE = {
  experience: [
    { name:'CSAT',                          unit:'pct',   segs:ALL_SEGS },
    { name:'Customer Effort Score (CES)',   unit:'score', segs:ALL_SEGS },
    { name:'NPS',                           unit:'score', segs:ALL_SEGS },
    { name:'Positive Perception',           unit:'pct',   segs:['ni','ind'] },
    { name:'Positive Partner Perception',   unit:'pct',   segs:['lta','sa'] },
    { name:'Portal Adoption',               unit:'pct',   segs:ALL_SEGS },
    { name:'KAM / Advisory Satisfaction',   unit:'pct',   segs:['ind','sa'] },
  ],
  commercial: [
    { name:'Opportunity Conversion Rate',    unit:'pct', segs:['ni','ind'] },
    { name:'Renewal Rate',                   unit:'pct', segs:ALL_SEGS },
    { name:'New Client Registration Growth', unit:'pct', segs:['ni','ind'] },
    { name:'New Client Growth',              unit:'pct', segs:['lta','sa'] },
    { name:'Expansion / Upsell Pipeline',    unit:'pct', segs:['ni','ind'] },
    { name:'VAS Uptake',                     unit:'pct', segs:ALL_SEGS },
    { name:'Agent Churn',                    unit:'pct', segs:['lta','sa'] },

  ],

    { name:'Renewal TAT',                    unit:'days', segs:ALL_SEGS },
    { name:'Amendment TAT',                  unit:'days', segs:ALL_SEGS },
    { name:'First Contact Resolution (FCR)', unit:'pct',  segs:ALL_SEGS },
    { name:'Average Handling Time (AHT)',    unit:'mins', segs:ALL_SEGS },

/* Current-state baselines. Split by segment where the scorecard splits them,
   `all` where the measure is organisation-wide. The scorecard reports ONE
   combined Agents column, so both agent segments show the same figure and it
   is labelled as combined. KPIs absent from here show "Not measured today"
   rather than an invented number. */
const KPI_BASELINES = {
  'CSAT':                          { ni:'Lic 88% / Visa 85% / Ren 88% / Amd 87%',
                                     ind:'Lic 95% / Visa 93% / Ren 95% / Amd 81%',
                                     agents:'Lic 85% / Visa 83% / Ren 87% / Amd 88%' },
  'Licensing TAT':                 { ni:'2 days',  ind:'11 days', agents:'2.5 days' },
  'Visa TAT':                      { ni:'5 days',  ind:'6 days',  agents:'5 days' },
  'Renewal TAT':                   { ni:'2 days',  ind:'3 days',  agents:'2.5 days' },
  'Amendment TAT':                 { ni:'6 days',  ind:'12 days', agents:'7 days' },
  'First Contact Resolution (FCR)':{ all:'75%' },
  'Average Handling Time (AHT)':   { all:'8 mins' },
  'Email Response Time':           { all:'8 hrs' },
  'NPS':                           { all:'64' },
  'Customer Effort Score (CES)':   { all:'60' },
  'Opportunity Conversion Rate':   { all:'12%' },
  'VAS Uptake':                    { all:'6%' },
};

function baselineFor(kpiName, segKey) {
  const b = KPI_BASELINES[kpiName];
  if (!b) return null;
  if (b.all) return { value: b.all, combined: false };
  if (segKey === 'lta' || segKey === 'sa') return b.agents ? { value: b.agents, combined: true } : null;
  return b[segKey] ? { value: b[segKey], combined: false } : null;
}

const TARGET_HINTS = { pct:'e.g. \u2265 90%', score:'e.g. \u2265 65', days:'e.g. \u2264 3 days', mins:'e.g. \u2264 6 mins', hrs:'e.g. \u2264 4 hrs' };

const ROUNDS = {

  emotion:   { key:'emotion',   label:'Define the Emotion',    icon:'💗', desc:'What 3 emotions should customers feel about RAKEZ after every interaction?' },
  ambition:  { key:'ambition',  label:'Defining the Ambition', icon:'🤝', desc:'Group activity — align the target ambition for your own segment across six levers.' },
  northstar: { key:'northstar', label:'Define the North Star',  icon:'🎯', desc:'Group activity — choose the KPIs that define success for your own segment, and set a target against today.' },

const STOPWORDS = new Set(['that','with','this','from','have','their','they','them','will','into','more','than','and','the','for','are','our','who','what','when','where','which','being','make','helps','help','while']);

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoJ_YfccwqP4m484gY1G4RZeacfNEFQlFvBA8r_t4xxaw-Poy0_VOEjJIxRlRAIRIP/exec';

function backendConfigured() {
  return APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith('PASTE_YOUR');
}

async function listResponses(round) {
  if (!backendConfigured()) return [];
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&round=${encodeURIComponent(round)}`);
    const data = await res.json();
    return Array.isArray(data) ? data.sort((a,b) => a.submittedAt - b.submittedAt) : [];
  } catch (e) { console.error('listResponses failed:', e); return []; }
}

async function saveResponse(round, record) {
  if (!backendConfigured()) throw new Error('Backend not configured yet — see APPS_SCRIPT_URL at the top of the script.');
  const url = `${APPS_SCRIPT_URL}?action=submit&round=${encodeURIComponent(round)}`
    + `&name=${encodeURIComponent(record.name)}`
    + `&answers=${encodeURIComponent(JSON.stringify(record.answers))}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data || data.ok !== true) throw new Error('Submit failed: ' + JSON.stringify(data));
}

async function clearRound(round) {
  if (!backendConfigured()) return;
  await fetch(`${APPS_SCRIPT_URL}?action=clear&round=${encodeURIComponent(round)}`);
}

function renderVisionSummary(records) {
  return SEGMENTS.map(seg => {
    const scores = records.map(r => r.answers && r.answers[seg.key] && r.answers[seg.key].score).filter(v => typeof v === 'number');
    const counts = [0,0,0,0,0];
    scores.forEach(v => { const band = levelForScore(v); counts[LEVELS.indexOf(band.name)]++; });
    const max = Math.max(...counts, 1);
    const modeIdx = counts.indexOf(Math.max(...counts));
    const avg = scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length) : null;
    return `
      <div class="seg-block">
        <h4><span class="seg-dot" style="background:${seg.color}"></span>${seg.icon} ${seg.label}
          ${avg !== null ? `<span style="margin-left:auto;color:${seg.color}">Avg ${avg.toFixed(1)}/5</span>` : ''}
        </h4>
        ${LEVELS.map((lvl,i) => `
          <div class="bar-row">
            <div class="bar-label">${lvl}</div>
            <div class="bar-track"><div class="bar-fill ${counts[i]>0 && i===modeIdx?'top':''}" style="width:${(counts[i]/max*100)||0}%"></div></div>
            <div class="bar-count">${counts[i]}</div>
          </div>`).join('')}
        ${renderOtherList(records, seg.key, 'benchmark', 'Aspiration Benchmark Statement')}
      </div>`;
  }).join('');
}

function renderOptionTally(groupKey, groupLabel, opts, records, segKey) {
  const counts = {}; opts.forEach(o => counts[o]=0);
  records.forEach(r => {
    const a = r.answers && r.answers[segKey] && r.answers[segKey][groupKey];
    if (!a) return;
    if (Array.isArray(a)) a.forEach(v => { if (counts[v]!==undefined) counts[v]++; });
    else if (counts[a]!==undefined) counts[a]++;
  });
  const max = Math.max(...Object.values(counts), 1);
  const topVal = Math.max(...Object.values(counts));
  return `<div style="margin:10px 0 6px"><div style="font-size:.74rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${groupLabel}</div>
    ${opts.map(o => `
      <div class="bar-row">
        <div class="bar-label">${o}</div>
        <div class="bar-track"><div class="bar-fill ${counts[o]>0 && counts[o]===topVal?'top':''}" style="width:${(counts[o]/max*100)||0}%"></div></div>
        <div class="bar-count">${counts[o]}</div>
      </div>`).join('')}
  </div>`;
}

function renderOtherList(records, segKey, fieldKey, label) {
  const entries = records.filter(r => r.answers && r.answers[segKey] && r.answers[segKey][fieldKey]);
  if (!entries.length) return '';
  return `<div style="margin:10px 0 6px">
    <div style="font-size:.74rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${label} — Other (participant-added)</div>
    <ul class="resp-list">
      ${entries.map(e => `<li class="resp-item"><span class="resp-name">${escapeHtml(e.name)}</span><span class="resp-time">${new Date(e.submittedAt).toLocaleTimeString()}</span><div class="resp-field">${escapeHtml(e.answers[segKey][fieldKey])}</div></li>`).join('')}
    </ul>
  </div>`;
}

/* Reads a figure like "\u2265 90%", "\u2264 3 days" or "64" into a number plus a unit.
   Multi-value baselines (segment CSAT is four service figures) return null on
   purpose — there is no single number to compare against. */
function parseMetric(str) {
  if (!str) return null;
  const text = String(str);
  const nums = text.match(/-?\d+(?:\.\d+)?/g);
  if (!nums || nums.length !== 1) return null;
  let unit = '';
  if (/%/.test(text)) unit = '%';
  else if (/day/i.test(text)) unit = 'days';
  else if (/min/i.test(text)) unit = 'mins';
  else if (/hr|hour/i.test(text)) unit = 'hrs';
  return { value: parseFloat(nums[0]), unit: unit };
}

/* Deliberately uncoloured. Lower is better for a TAT and higher is better for
   CSAT, and nothing in the data says which way a custom KPI runs — so the chip
   states the movement and lets the room read it. */
function movementChip(baselineValue, targetValue) {
  const b = parseMetric(baselineValue), t = parseMetric(targetValue);
  if (!b || !t || b.unit !== t.unit) return '';
  const diff = Math.round((t.value - b.value) * 10) / 10;
  if (!diff) return '<span class="ns-delta">holds today</span>';
  const noun = (!b.unit || b.unit === '%') ? 'pts' : b.unit;
  const unitLabel = ' ' + (Math.abs(diff) === 1 ? noun.replace(/s$/, '') : noun);
  return `<span class="ns-delta">${diff > 0 ? '+' : '\u2212'}${Math.abs(diff)}${unitLabel}</span>`;
}

function renderNorthStarSummary(records) {
  return SEGMENTS.map(seg => {
    // One group owns one segment, so the useful unit is the KPI and its target
    // rather than a popularity bar. Where two people in a group both submitted,
    // the most-proposed target leads and the rest are listed underneath.
    const themes = {};
    let participants = 0, kpiTotal = 0;
    KPI_THEMES.forEach(th => { themes[th.key] = {}; });

    records.forEach(r => {
      const segAns = r.answers && r.answers[seg.key];
      if (!segAns) return;
      let counted = false;
      KPI_THEMES.forEach(th => {
        (segAns[th.key] || []).forEach(it => {
          if (!counted) { participants++; counted = true; }
          const bucket = themes[th.key][it.kpi] || { kpi: it.kpi, count: 0, targets: [] };
          bucket.count++;
          if (it.target) bucket.targets.push(it.target);
          themes[th.key][it.kpi] = bucket;
        });
      });
    });

    const cards = KPI_THEMES.map(th => {
      const order = KPI_CATALOGUE[th.key].map(k => k.name);
      const rank = name => { const i = order.indexOf(name); return i === -1 ? 999 : i; };  // custom KPIs last
      const rows = Object.keys(themes[th.key]).map(k => themes[th.key][k])
        .sort((a, b) => rank(a.kpi) - rank(b.kpi) || a.kpi.localeCompare(b.kpi));
      kpiTotal += rows.length;
      const body = rows.length ? rows.map(row => {
        const freq = {};
        row.targets.forEach(t => { freq[t] = (freq[t] || 0) + 1; });
        const ranked = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
        const lead = ranked[0] || '';
        const alts = ranked.slice(1);
        const base = baselineFor(row.kpi, seg.key);
        return `
          <div class="ns-kpi">
            <div class="ns-kpi-top">
              <span class="ns-kpi-name">${escapeHtml(row.kpi)}</span>
              <span class="ns-kpi-target${lead ? '' : ' none'}">${lead ? escapeHtml(lead) : 'no target'}</span>
            </div>
            <div class="ns-kpi-base">${base
              ? `Today ${escapeHtml(base.value)}${lead ? movementChip(base.value, lead) : ''}`
              : 'Not measured today'}</div>
            ${alts.length ? `<div class="ns-alt">Also proposed: <b>${escapeHtml(alts.join(', '))}</b></div>` : ''}
          </div>`;
      }).join('') : '<div class="ns-empty">Nothing picked yet.</div>';

      return `
        <div class="ns-card">
          <div class="ns-card-head"><span class="ns-ic">${th.icon}</span><h5>${th.label}</h5>
            ${rows.length ? `<span class="ns-num">${rows.length}</span>` : ''}
          </div>
          ${body}
        </div>`;
    }).join('');

    const meta = participants
      ? `${kpiTotal} KPI${kpiTotal === 1 ? '' : 's'} set \u00B7 ${participants} submission${participants === 1 ? '' : 's'}`
      : 'awaiting this group';

    return `
      <div class="ns-seg" style="border-left-color:${seg.color}">
        <div class="ns-seg-head">
          <span class="ns-seg-name" style="color:${seg.color}">${seg.icon} ${seg.label}</span>
          <span class="ns-seg-meta">${meta}</span>
        </div>
        ${participants ? `<div class="ns-grid">${cards}</div>` : '<div class="ns-waiting">This group hasn\u2019t submitted yet.</div>'}
      </div>`;
  }).join('');
}

function keywordChips(text) {
  const freq = {};
  text.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).forEach(w => {
    if (w.length > 3 && !STOPWORDS.has(w)) freq[w] = (freq[w]||0)+1;
  });
  return Object.entries(freq).filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

function renderAmbitionSummary(records) {
  return SEGMENTS.map(seg => {
    const entries = records.filter(r => {
      const a = r.answers && r.answers[seg.key];
      if (!a) return false;
      return a.role || a.promise || a.feelOther || a.serveOther || a.channelOther || a.owner || a.ownerOther ||
        (a.feel && a.feel.length) || (a.serve && a.serve.length) || (a.channel && a.channel.length);
    });
    if (!entries.length) return `
      <div class="seg-block"><h4><span class="seg-dot" style="background:${seg.color}"></span>${seg.icon} ${seg.label}</h4>
      <div class="empty-state" style="padding:8px 0">No responses yet for this segment.</div></div>`;
    const combined = entries.map(e => `${e.answers[seg.key].role||''} ${e.answers[seg.key].promise||''}`).join(' ');
    const kws = keywordChips(combined);
    return `
      <div class="seg-block">
        <h4><span class="seg-dot" style="background:${seg.color}"></span>${seg.icon} ${seg.label}</h4>
        ${kws.length ? `<div style="margin-bottom:10px">${kws.map(([w,c]) => `<span class="kw-chip">${w} ×${c}</span>`).join('')}</div>` : ''}
        <ul class="resp-list">
          ${entries.map(e => `
            <li class="resp-item">
              <span class="resp-name">${escapeHtml(e.name)}</span><span class="resp-time">${new Date(e.submittedAt).toLocaleTimeString()}</span>
              ${e.answers[seg.key].role ? `<div class="resp-field"><strong>Role:</strong> ${escapeHtml(e.answers[seg.key].role)}</div>` : ''}
              ${e.answers[seg.key].promise ? `<div class="resp-field"><strong>Promise:</strong> ${escapeHtml(e.answers[seg.key].promise)}</div>` : ''}
              ${e.answers[seg.key].feel && e.answers[seg.key].feel.length ? `<div class="resp-field"><strong>Feels like:</strong> ${escapeHtml(e.answers[seg.key].feel.join(', '))}</div>` : ''}
              ${e.answers[seg.key].serve && e.answers[seg.key].serve.length ? `<div class="resp-field"><strong>Served by:</strong> ${escapeHtml(e.answers[seg.key].serve.join(', '))}</div>` : ''}
              ${e.answers[seg.key].channel && e.answers[seg.key].channel.length ? `<div class="resp-field"><strong>Channel:</strong> ${escapeHtml(e.answers[seg.key].channel.join(', '))}</div>` : ''}
              ${e.answers[seg.key].owner ? `<div class="resp-field"><strong>Owned by:</strong> ${escapeHtml(e.answers[seg.key].owner)}</div>` : ''}
            </li>`).join('')}
        </ul>
        ${renderOptionTally('feel', 'Engaging with us should feel like', FEEL_OPTS, records, seg.key)}
        ${renderOtherList(records, seg.key, 'feelOther', 'Engaging with us should feel like')}
        ${renderOptionTally('serve', 'The way we serve them', SERVE_OPTS, records, seg.key)}
        ${renderOtherList(records, seg.key, 'serveOther', 'The way we serve them')}
        ${renderOptionTally('channel', 'Preferred channel', CHANNEL_OPTS, records, seg.key)}
        ${renderOtherList(records, seg.key, 'channelOther', 'Preferred channel')}
        ${renderOptionTally('owner', 'Relationship owned by', OWNER_OPTS, records, seg.key)}
        ${renderOtherList(records, seg.key, 'ownerOther', 'Relationship owned by')}
      </div>`;
  }).join('');
}

function renderEmotionSummary(records) {
  return SEGMENTS.map(seg => {
    const counts = {};
    let respondentCount = 0;
    records.forEach(r => {
      const a = r.answers && r.answers[seg.key];
      if (!a || !a.words || !a.words.length) return;
      respondentCount++;
      a.words.forEach(w => {
        const key = w.trim().toLowerCase();
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
      });
    });
    const top = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 5);
    const max = Math.max(...top.map(t => t[1]), 1);
    return `
      <div class="seg-block">
        <h4><span class="seg-dot" style="background:${seg.color}"></span>${seg.icon} ${seg.label}
          <span style="margin-left:auto;color:${seg.color}">n=${respondentCount}</span>
        </h4>
        ${top.length ? top.map(([w,c]) => `
          <div class="bar-row">
            <div class="bar-label">${escapeHtml(w)}</div>
            <div class="bar-track"><div class="bar-fill ${c===top[0][1]?'top':''}" style="width:${(c/max*100)||0}%"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join('') : '<div class="empty-state" style="padding:8px 0">No responses yet.</div>'}
      </div>`;
  }).join('');
}

function exportRound(round) {
  listResponses(round).then(records => {
    let rows = [['Name','Segment','Field','Value','Submitted At']];
    records.forEach(r => {
      SEGMENTS.forEach(seg => {
        const a = r.answers && r.answers[seg.key];
        if (a === undefined || a === null) return;
        if (round === 'vision') {
          if (typeof a.score === 'number') {
            rows.push([r.name, seg.label, 'Score', a.score.toFixed(1), new Date(r.submittedAt).toISOString()]);
            rows.push([r.name, seg.label, 'Level', levelForScore(a.score).name, new Date(r.submittedAt).toISOString()]);
          }
          if (a.benchmark) rows.push([r.name, seg.label, 'Aspiration Benchmark Statement', a.benchmark, new Date(r.submittedAt).toISOString()]);
        } else if (round === 'ambition') {
          const ts = new Date(r.submittedAt).toISOString();
          if (a.role) rows.push([r.name, seg.label, 'Role', a.role, ts]);
          if (a.promise) rows.push([r.name, seg.label, 'Promise', a.promise, ts]);
          if (a.feel && a.feel.length) rows.push([r.name, seg.label, 'feel', a.feel.join('; '), ts]);
          if (a.feelOther) rows.push([r.name, seg.label, 'feel (other)', a.feelOther, ts]);
          if (a.serve && a.serve.length) rows.push([r.name, seg.label, 'serve', a.serve.join('; '), ts]);
          if (a.serveOther) rows.push([r.name, seg.label, 'serve (other)', a.serveOther, ts]);
          if (a.channel && a.channel.length) rows.push([r.name, seg.label, 'channel', a.channel.join('; '), ts]);
          if (a.channelOther) rows.push([r.name, seg.label, 'channel (other)', a.channelOther, ts]);
          if (a.owner) rows.push([r.name, seg.label, 'owner', a.owner, ts]);
          if (a.ownerOther) rows.push([r.name, seg.label, 'owner (other)', a.ownerOther, ts]);
        } else if (round === 'northstar') {
          const ts = new Date(r.submittedAt).toISOString();
          KPI_THEMES.forEach(th => {
            (a[th.key] || []).forEach(it => {
              rows.push([r.name, seg.label, th.label + ' \u2014 ' + it.kpi, it.target || '', ts]);
            });
          });
        } else if (round === 'emotion') {
          if (a.words && a.words.length) rows.push([r.name, seg.label, 'Emotions', a.words.join('; '), new Date(r.submittedAt).toISOString()]);
        }
      });
    });
    const csv = 'data:text/csv;charset=utf-8,' + rows.map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const link = document.createElement('a');
    link.href = encodeURI(csv);
    link.download = `RAKEZ_CX_${round}_responses.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  });
}

function northStarTheme(seg, th) {
  const opts = KPI_CATALOGUE[th.key].filter(k => k.segs.indexOf(seg.key) !== -1);

function kpiRow(seg, th, k, i) {
  const base = baselineFor(k.name, seg.key);
  const id = `ns_${seg.key}_${th.key}_${i}`;
  const baseHtml = base
    ? `<span class="kpi-base">Today ${escapeHtml(base.value)}${base.combined ? ' <em>(agents combined)</em>' : ''}</span>`
    : '<span class="kpi-base none">Not measured today</span>';
  return `
    <div class="kpi-row" id="${id}" data-kpi="${escapeHtml(k.name)}">
      <div class="kpi-head" onclick="toggleKpi('${id}','${seg.key}','${th.key}')">

        ${baseHtml}

      </div>
    </div>`;
}

function themeBlockEl(segKey, themeKey) {
  return document.querySelector(`.theme-block[data-seg="${segKey}"][data-theme="${themeKey}"]`);
}

function selectedKpiRows(segKey, themeKey) {
  const block = themeBlockEl(segKey, themeKey);
  return block ? Array.from(block.querySelectorAll('.kpi-row.on')) : [];
}

function kpiRowValues(row) {
  const nameEl = row.querySelector('.custom-name');
  const targetEl = row.querySelector('.target-input');
  return {
    kpi: nameEl ? nameEl.value.trim() : (row.dataset.kpi || ''),
    target: targetEl ? targetEl.value.trim().replace(/[;|]/g, ',') : ''
  };
}

function updateKpiCount(segKey, themeKey) {
  const el = document.getElementById(`ns_${segKey}_${themeKey}_count`);
  if (!el) return;
  const n = selectedKpiRows(segKey, themeKey).length;
  el.textContent = `${n} / ${MAX_KPIS_PER_THEME}`;
  el.classList.toggle('full', n >= MAX_KPIS_PER_THEME);
}

function flashThemeLimit(segKey, themeKey) {
  const err = document.getElementById(`ns_${segKey}_${themeKey}_err`);
  if (!err) return;
  err.textContent = `Up to ${MAX_KPIS_PER_THEME} KPIs per theme — deselect one first.`;
  err.style.display = 'block';
}

function toggleKpi(id, segKey, themeKey) {
  const row = document.getElementById(id);
  if (!row) return;
  const turningOn = !row.classList.contains('on');
  if (turningOn && selectedKpiRows(segKey, themeKey).length >= MAX_KPIS_PER_THEME) {
    flashThemeLimit(segKey, themeKey);
    return;
  }
  row.classList.toggle('on', turningOn);
  if (turningOn) { const t = document.getElementById(id + '_t'); if (t) t.focus(); }
  updateKpiCount(segKey, themeKey);
  clearErrById(`ns_${segKey}_${themeKey}_err`);
}

function addCustomKpi(segKey, themeKey) {
  if (selectedKpiRows(segKey, themeKey).length >= MAX_KPIS_PER_THEME) {
    flashThemeLimit(segKey, themeKey);
    return;
  }
  const host = document.getElementById(`ns_${segKey}_${themeKey}_custom`);
  if (!host) return;
  const uid = `ns_${segKey}_${themeKey}_c${Math.random().toString(36).slice(2, 8)}`;
  const div = document.createElement('div');
  div.className = 'kpi-row on custom';
  div.id = uid;
  div.innerHTML = `
    <div class="kpi-head" style="cursor:default">
      <span class="kpi-tick"></span>
      <input type="text" class="custom-name" id="${uid}_n" placeholder="Your own KPI" oninput="clearErrById('ns_${segKey}_${themeKey}_err')">
      <button type="button" class="kpi-remove" title="Remove" onclick="removeCustomKpi('${uid}','${segKey}','${themeKey}')">&#10005;</button>
    </div>
    <div class="kpi-target">
      <input type="text" class="target-input" id="${uid}_t" placeholder="Target — e.g. &#8805; 90%" oninput="clearErrById('ns_${segKey}_${themeKey}_err')">
    </div>`;
  host.appendChild(div);
  const nameInput = document.getElementById(uid + '_n');
  if (nameInput) nameInput.focus();
  updateKpiCount(segKey, themeKey);
  clearErrById(`ns_${segKey}_${themeKey}_err`);
}

function removeCustomKpi(uid, segKey, themeKey) {
  const el = document.getElementById(uid);
  if (el && el.parentNode) el.parentNode.removeChild(el);
  updateKpiCount(segKey, themeKey);
}

function currentTabSeg(prefix) {
  const t = document.querySelector(`#${prefix}Tabs .seg-tab.active`);
  return t ? t.dataset.seg : null;
}

function switchTab(prefix, seg) {
  document.querySelectorAll(`#${prefix}Tabs .seg-tab`).forEach(t => t.classList.toggle('active', t.dataset.seg===seg));
  document.querySelectorAll(`#${prefix}Panels .seg-panel`).forEach(p => p.classList.toggle('active', p.dataset.seg===seg));
}

function toggleChipEl(labelEl, multi, errId) {
  if (!multi) {
    const group = labelEl.closest('.chip-grid');
    group.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    labelEl.classList.add('on');
    labelEl.querySelector('input').checked = true;
  } else {
    const input = labelEl.querySelector('input');
    input.checked = !input.checked;
    labelEl.classList.toggle('on', input.checked);
  }
  if (errId) { const err = document.getElementById(errId); if (err) err.style.display = 'none'; }
}

function clearFieldErr(el) {
  const err = document.getElementById(el.id + '_err');
  if (err) err.style.display = 'none';
}

function clearErrById(errId) {
  const err = document.getElementById(errId);
  if (err) err.style.display = 'none';
}

function collectVisionAnswers() {
  const answers = {};
  document.querySelectorAll('.vision-card').forEach(card => {
    const seg = card.dataset.seg;
    const benchmark = document.getElementById(`vbenchmark_${seg}`).value.trim();
    if (card.dataset.touched === '1') {
      const slider = card.querySelector('.range-slider');
      answers[seg] = { score: Math.round(parseFloat(slider.value) * 10) / 10, benchmark: benchmark };
    } else if (benchmark) {
      // Slider untouched but they wrote a benchmark anyway — still capture the text (score stays null)
      answers[seg] = { score: null, benchmark: benchmark };
    }
  });
  return answers;
}

function collectAmbitionAnswers() {
  const answers = {};
  SEGMENTS.forEach(seg => {
    const panel = document.querySelector(`#ambPanels .seg-panel[data-seg="${seg.key}"]`);
    const role = document.getElementById(`amb_${seg.key}_role`).value.trim();
    const promise = document.getElementById(`amb_${seg.key}_promise`).value.trim();
    const feel = Array.from(panel.querySelectorAll(`input[name="${seg.key}_feel"]:checked`)).map(i=>i.value);
    const feelOther = document.getElementById(`amb_${seg.key}_feel_other`).value.trim();
    const serve = Array.from(panel.querySelectorAll(`input[name="${seg.key}_serve"]:checked`)).map(i=>i.value);
    const serveOther = document.getElementById(`amb_${seg.key}_serve_other`).value.trim();
    const channel = Array.from(panel.querySelectorAll(`input[name="${seg.key}_channel"]:checked`)).map(i=>i.value);
    const channelOther = document.getElementById(`amb_${seg.key}_channel_other`).value.trim();
    const ownerEl = panel.querySelector(`input[name="${seg.key}_owner"]:checked`);
    const ownerOther = document.getElementById(`amb_${seg.key}_owner_other`).value.trim();
    if (role || promise || feel.length || feelOther || serve.length || serveOther || channel.length || channelOther || ownerEl || ownerOther) {
      answers[seg.key] = {
        role, promise, feel, feelOther, serve, serveOther, channel, channelOther,
        owner: ownerEl ? ownerEl.value : null, ownerOther
      };
    }
  });
  return answers;
}

function collectNorthStarAnswers() {
  const answers = {};
  SEGMENTS.forEach(seg => {
    const segOut = {};
    let any = false;
    KPI_THEMES.forEach(th => {
      const items = selectedKpiRows(seg.key, th.key)
        .map(kpiRowValues)
        .filter(v => v.kpi);
      segOut[th.key] = items;
      if (items.length) any = true;
    });
    if (any) answers[seg.key] = segOut;
  });
  return answers;
}

function collectEmotionAnswers() {
  const answers = {};
  SEGMENTS.forEach(seg => {
    const words = [1, 2, 3]
      .map(i => document.getElementById(`emo_${seg.key}_${i}`).value.trim())
      .filter(Boolean);
    if (words.length) answers[seg.key] = { words };
  });
  return answers;
}

function validateEmotion() {
  let valid = true;
  let firstInvalidCard = null;
  SEGMENTS.forEach(seg => {
    const anyFilled = [1, 2, 3].some(i => document.getElementById(`emo_${seg.key}_${i}`).value.trim());
    if (!anyFilled) {
      valid = false;
      const err = document.getElementById(`emo_${seg.key}_1_err`);
      if (err) err.style.display = 'block';
      if (!firstInvalidCard) firstInvalidCard = document.querySelector(`.vision-card[data-seg="${seg.key}"]`);
    }
  });
  if (firstInvalidCard && firstInvalidCard.scrollIntoView) firstInvalidCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return valid;
}

function validateVision() {
  let valid = true;
  let firstInvalidCard = null;
  document.querySelectorAll('.vision-card').forEach(card => {
    if (card.dataset.touched !== '1') {
      valid = false;
      const err = document.getElementById(`vErr_${card.dataset.seg}`);
      if (err) err.style.display = 'block';
      if (!firstInvalidCard) firstInvalidCard = card;
    }
  });
  if (firstInvalidCard && firstInvalidCard.scrollIntoView) firstInvalidCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return valid;
}

/* Group activity: each group answers for its own segment only. A segment
   counts as "started" as soon as any one of its six levers is filled; every
   started segment must then be complete, and at least one must be. Untouched
   segments are left alone — they belong to the other groups. */
function ambitionSegmentState(segKey) {
  const panel = document.querySelector(`#ambPanels .seg-panel[data-seg="${segKey}"]`);
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  return {
    role:    !!val(`amb_${segKey}_role`),
    promise: !!val(`amb_${segKey}_promise`),
    feel:    panel.querySelectorAll(`input[name="${segKey}_feel"]:checked`).length > 0 || !!val(`amb_${segKey}_feel_other`),
    serve:   panel.querySelectorAll(`input[name="${segKey}_serve"]:checked`).length > 0 || !!val(`amb_${segKey}_serve_other`),
    channel: panel.querySelectorAll(`input[name="${segKey}_channel"]:checked`).length > 0 || !!val(`amb_${segKey}_channel_other`),
    owner:   !!panel.querySelector(`input[name="${segKey}_owner"]:checked`) || !!val(`amb_${segKey}_owner_other`)
  };
}

const AMBITION_FIELDS = ['role','promise','feel','serve','channel','owner'];

function validateAmbition() {
  let firstInvalidSeg = null;
  let completed = 0;
  let anyStarted = false;

  SEGMENTS.forEach(seg => {
    const state = ambitionSegmentState(seg.key);
    if (!AMBITION_FIELDS.some(f => state[f])) return;   // untouched — another group's segment
    anyStarted = true;

    let segInvalid = false;
    AMBITION_FIELDS.forEach(f => {
      if (state[f]) return;
      const err = document.getElementById(`amb_${seg.key}_${f}_err`);
      if (err) err.style.display = 'block';
      segInvalid = true;
    });

    if (segInvalid) { if (!firstInvalidSeg) firstInvalidSeg = seg.key; }
    else completed++;
  });

  if (!anyStarted) {
    const segKey = currentTabSeg('amb') || SEGMENTS[0].key;
    AMBITION_FIELDS.forEach(f => {
      const err = document.getElementById(`amb_${segKey}_${f}_err`);
      if (err) err.style.display = 'block';
    });
    switchTab('amb', segKey);
    const el = document.querySelector(`#ambPanels .seg-panel[data-seg="${segKey}"]`);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return false;
  }

  if (firstInvalidSeg) {
    switchTab('amb', firstInvalidSeg);
    const el = document.querySelector(`#ambPanels .seg-panel[data-seg="${firstInvalidSeg}"]`);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return false;
  }

  return completed > 0;
}

/* A segment counts as "started" the moment one KPI is picked anywhere in it.
   Every started segment must then be complete: all three themes with at least
   one KPI, and a target on every KPI picked. Groups working a single segment
   therefore only fill their own; nobody is forced through all four. */
function validateNorthStar() {
  let firstInvalidSeg = null;
  let completed = 0;
  let anyStarted = false;

  SEGMENTS.forEach(seg => {
    const rowsPerTheme = KPI_THEMES.map(th => selectedKpiRows(seg.key, th.key));
    if (!rowsPerTheme.some(rows => rows.length)) return;
    anyStarted = true;

    let segInvalid = false;
    KPI_THEMES.forEach((th, i) => {
      const rows = rowsPerTheme[i];
      const err = document.getElementById(`ns_${seg.key}_${th.key}_err`);
      if (!rows.length) {
        if (err) { err.textContent = 'Pick at least one KPI for this theme.'; err.style.display = 'block'; }
        segInvalid = true;
        return;
      }
      const incomplete = rows.some(row => { const v = kpiRowValues(row); return !v.kpi || !v.target; });
      if (incomplete) {
        if (err) { err.textContent = 'Every KPI you pick needs a name and a target.'; err.style.display = 'block'; }
        segInvalid = true;
      }
    });

    if (segInvalid) { if (!firstInvalidSeg) firstInvalidSeg = seg.key; }
    else completed++;
  });

  if (!anyStarted) {
    const segKey = currentTabSeg('ns') || SEGMENTS[0].key;
    const err = document.getElementById(`ns_${segKey}_experience_err`);
    if (err) { err.textContent = 'Pick at least one KPI for this theme.'; err.style.display = 'block'; }
    switchTab('ns', segKey);
    const el = themeBlockEl(segKey, 'experience');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return false;
  }

  if (firstInvalidSeg) {
    switchTab('ns', firstInvalidSeg);
    const el = document.querySelector(`#nsPanels .seg-panel[data-seg="${firstInvalidSeg}"]`);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return false;
  }

  return completed > 0;
}

async function submitParticipant() {
  const nameEl = document.getElementById('pName');
  const name = nameEl.value.trim();
  if (!name) { document.getElementById('nameErr').style.display = 'block'; nameEl.focus(); return; }
  document.getElementById('nameErr').style.display = 'none';

  document.querySelectorAll('.err').forEach(e => e.style.display = 'none');

  let answers = {};
  if (state.round === 'vision') {
    if (!validateVision()) return;
    answers = collectVisionAnswers();
  } else if (state.round === 'ambition') {
    if (!validateAmbition()) return;
    answers = collectAmbitionAnswers();
  } else if (state.round === 'emotion') {
    if (!validateEmotion()) return;
    answers = collectEmotionAnswers();
  } else {
    if (!validateNorthStar()) return;
    answers = collectNorthStarAnswers();
  }

  const btn = document.querySelector('.submit-bar button');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  try {
    await saveResponse(state.round, { name, submittedAt: Date.now(), answers });
    state.doneSubmitting = true;
    render();
  } catch (e) {
    alert('Sorry, your response could not be saved. Please check your connection and try again.\n\n' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Submit my response'; }
  }
}

/* ============================== BOOT ============================== */
function afterRender() {
  if (state.mode === 'facilitator') {
    const link = buildRoundLink(state.facRound);
    const linkBox = document.getElementById('linkBox');
    if (linkBox) linkBox.value = link;
    const qrEl = document.getElementById('qrcode');
    if (qrEl && window.QRCode) {
      qrEl.innerHTML = '';
      new QRCode(qrEl, { text: link, width: 176, height: 176, colorDark: '#028090', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
    const warnEl = document.getElementById('backendWarn');
    if (warnEl) warnEl.style.display = backendConfigured() ? 'none' : 'block';
    refreshAll();
  }
}

render();
if (state.mode === 'facilitator') {
  setInterval(refreshAll, 8000);
}
</script>
